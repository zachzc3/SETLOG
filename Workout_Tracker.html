<style>

    --border: #2A3140;
    --text: #ECEEF2;
    --text-muted: #8A93A6;
    --accent: #F2A93B;
    --accent-dim: #7A5A20;
    --good: #4ADE80;
    --danger: #E8604A;
    --info: #4A90E2;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  #wt-root {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .wt-topbar {
    padding: 22px 20px 14px;
    border-bottom: 1px solid var(--border);
  }
  .wt-topbar h1 {

    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.02em;
  }
  .wt-topbar .wt-sub {

    font-size: 12px;

    letter-spacing: 0.12em;

  .wt-elapsed {

  .wt-main {

  .wt-bottomnav {
    position: fixed;
    bottom: 0;
    left: 50%;

  .wt-navbtn {

    background: none;

    font-family: var(--font);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 10px 4px 8px;
    border-radius: 10px;
    cursor: pointer;
  }
  .wt-navbtn.active { color: var(--accent); background: var(--surface-2); }

  .wt-btn {
    font-family: var(--font);
    border: none;
    border-radius: 12px;

    font-weight: 700;
    font-size: 15px;

  .wt-btn-primary { background: var(--accent); color: #1A1200; }
  .wt-btn-primary:active { background: #d99427; }
  .wt-btn-ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }

  .wt-empty .wt-empty-title {
    color: var(--text);
    font-weight: 800;
    font-size: 17px;
    margin-bottom: 8px;

  .wt-card {

    font-weight: 700;
    padding: 8px 10px;
    width: 100%;

  .wt-field input:disabled { opacity: 0.5; }
  .wt-logbtn {

<script>
(function () {
  // Standalone-hosting storage: window.storage only exists inside the Claude artifact runtime.
  // Outside it (e.g. GitHub Pages), fall back through: Supabase (if configured + signed in,
  // for real cross-device sync) -> localStorage (single-device, always available as a floor).
  // Everything else in this file just calls window.storage and never knows which tier is live.
  const IS_NATIVE = !!window.storage;
  let sbClient = null;
  let sbUser = null;

  function getSbConfig() {
    try { return JSON.parse(localStorage.getItem("wt-sb-config") || "null"); }
    catch (e) { return null; }
  }
  function setSbConfig(cfg) { localStorage.setItem("wt-sb-config", JSON.stringify(cfg)); }
  function clearSbConfig() { localStorage.removeItem("wt-sb-config"); }

  async function initStorage() {
    if (IS_NATIVE) return;
    const cfg = getSbConfig();
    if (cfg && cfg.url && cfg.anonKey && window.supabase) {
      try {
        sbClient = window.supabase.createClient(cfg.url, cfg.anonKey);
        const { data } = await sbClient.auth.getSession();
        sbUser = data && data.session ? data.session.user : null;
      } catch (e) { sbClient = null; sbUser = null; }
    }
    window.storage = {
      get: async (key) => {
        if (sbClient && sbUser) {
          const { data, error } = await sbClient.from("kv_store").select("value").eq("key", key).maybeSingle();
          if (error) throw error;
          return data ? { value: data.value } : null;
        }
        const v = localStorage.getItem(key);
        return v === null ? null : { value: v };
      },
      set: async (key, value) => {
        if (sbClient && sbUser) {
          const { error } = await sbClient.from("kv_store").upsert({ user_id: sbUser.id, key, value, updated_at: new Date().toISOString() });
          if (error) throw error;
          return;
        }
        localStorage.setItem(key, value);
      },
      delete: async (key) => {
        if (sbClient && sbUser) {
          const { error } = await sbClient.from("kv_store").delete().eq("key", key);
          if (error) throw error;
          return;
        }
        localStorage.removeItem(key);
      }
    };
  }

  const MUSCLE_GROUPS = ["Chest", "Back", "Shoulders", "Arms", "Legs", "Core", "Cardio", "Other"];

  const DEFAULT_LIBRARY = [

    { id: "face-pull", name: "Cable Face Pull", muscleGroup: "Shoulders", usesWeight: true, sets: 3, reps: 10, weight: 0, restSets: 60, restNext: 45 },
    { id: "db-row", name: "One-Arm DB Row", muscleGroup: "Back", usesWeight: true, sets: 3, reps: 10, weight: 0, restSets: 75, restNext: 60 },
    { id: "curl", name: "Cable / DB Curl", muscleGroup: "Arms", usesWeight: true, sets: 3, reps: 10, weight: 0, restSets: 60, restNext: 60 },
    { id: "leg-press", name: "Leg Press", muscleGroup: "Legs", usesWeight: true, sets: 3, reps: 10, weight: 0, restSets: 120, restNext: 75 },
    { id: "leg-extension", name: "Leg Extension", muscleGroup: "Legs", usesWeight: true, sets: 3, reps: 10, weight: 0, restSets: 60, restNext: 60 },
    { id: "leg-curl", name: "Leg Curl", muscleGroup: "Legs", usesWeight: true, sets: 3, reps: 10, weight: 0, restSets: 60, restNext: 60 },
    { id: "calf-raise", name: "Calf Raise", muscleGroup: "Legs", usesWeight: true, sets: 3, reps: 10, weight: 0, restSets: 45, restNext: 45 },
    { id: "walking-lunge", name: "Walking Lunge", muscleGroup: "Legs", usesWeight: true, sets: 3, reps: 10, weight: 0, restSets: 75, restNext: 60 }

  const RECOMMENDED_EXTRA_EXERCISES = [
    // Warm-up

    return `<svg viewBox="0 0 120 200" width="100" height="167" style="display:block;margin:0 auto;">
        <circle cx="60" cy="18" r="14" fill="${off}"/>
        <circle cx="40" cy="42" r="9" fill="${fill(muscleGroup === "Shoulders")}"/>
        <circle cx="80" cy="42" r="9" fill="${fill(muscleGroup === "Shoulders")}"/>
        <rect x="40" y="38" width="40" height="34" rx="6" fill="${fill(muscleGroup === "Chest")}" ${outline}/>
        <rect x="42" y="74" width="36" height="34" rx="6" fill="${fill(muscleGroup === "Core")}" ${outline}/>
        <rect x="18" y="42" width="14" height="60" rx="6" fill="${fill(muscleGroup === "Arms")}"/>
        <rect x="88" y="42" width="14" height="60" rx="6" fill="${fill(muscleGroup === "Arms")}"/>
        <rect x="44" y="110" width="14" height="70" rx="6" fill="${fill(muscleGroup === "Legs")}"/>
        <rect x="62" y="110" width="14" height="70" rx="6" fill="${fill(muscleGroup === "Legs")}"/>
      </svg>
      <div style="text-align:center;color:var(--text-muted);font-size:11px;margin-top:4px;">${escapeHtml(muscleGroup)}${muscleGroup === "Back" ? " (outlined — upper back/lats)" : ""}</div>`;
  }

  function groupLibraryForDisplay(list) {
    const groups = {};
    list.forEach(e => {
      const g = e.muscleGroup && MUSCLE_GROUPS.includes(e.muscleGroup) ? e.muscleGroup : "Other";
      (groups[g] = groups[g] || []).push(e);
    });
    const names = Object.keys(groups).filter(g => g !== "Other").sort();
    if (groups["Other"]) names.push("Other");
    return names.map(group => ({
      group,
      exercises: groups[group].slice().sort((a, b) => a.name.localeCompare(b.name))
    }));
  }

  let library = [];
  let sessions = [];
  let templates = [];
  let active = null; // in-progress session
  let profile = null; // { name }
  let currentView = "workout";

  function fmtDate(d) {
    return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
  }
  function fmtTime(sec) {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return m + ":" + String(s).padStart(2, "0");
  }
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  // ---------- storage ----------
  async function loadAll() {
    try {
      const lib = await window.storage.get("exercise-library");
      library = lib ? JSON.parse(lib.value) : DEFAULT_LIBRARY.slice();
    } catch (e) { library = DEFAULT_LIBRARY.slice(); }

    try {
      const s = await window.storage.get("workout-sessions");
      sessions = s ? JSON.parse(s.value) : [];
    } catch (e) { sessions = []; }

    try {
      const t = await window.storage.get("workout-templates");
      templates = t ? JSON.parse(t.value) : [];
    } catch (e) { templates = []; }

    try {
      const a = await window.storage.get("active-session");
      active = a ? JSON.parse(a.value) : null;
    } catch (e) { active = null; }

    try {
      const p = await window.storage.get("profile");
      profile = p ? JSON.parse(p.value) : null;
    } catch (e) { profile = null; }
  }

  async function saveLibrary() {
    try { await window.storage.set("exercise-library", JSON.stringify(library)); }
    catch (e) { console.error("save library failed", e); showToast("⚠ Save failed — see Settings"); }
  }
  async function saveSessions() {
    try { await window.storage.set("workout-sessions", JSON.stringify(sessions)); }
    catch (e) { console.error("save sessions failed", e); showToast("⚠ Save failed — see Settings"); }
  }
  async function saveTemplates() {
    try { await window.storage.set("workout-templates", JSON.stringify(templates)); }
    catch (e) { console.error("save templates failed", e); showToast("⚠ Save failed — see Settings"); }
  }
  async function saveActive() {
    try {
      if (active) await window.storage.set("active-session", JSON.stringify(active));
      else await window.storage.delete("active-session");
    } catch (e) { console.error("save active failed", e); showToast("⚠ Save failed — see Settings"); }
  }
  async function saveProfile() {
    try { await window.storage.set("profile", JSON.stringify(profile)); }
    catch (e) { console.error("save profile failed", e); showToast("⚠ Save failed — see Settings"); }
  }

  function showToast(msg) {
    const t = document.createElement("div");
    t.className = "wt-toast";
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 1800);
  }

  // ---------- rendering shell ----------
  function setNav() {
    document.querySelectorAll(".wt-navbtn").forEach(b => {
      b.classList.toggle("active", b.dataset.view === currentView);
    });
    const titles = { workout: "Session", exercises: "Exercises", history: "History", progress: "Progress", settings: "Settings" };
    document.querySelector(".wt-topbar h1").textContent = titles[currentView];
    if (currentView === "settings") {
      $datestr.textContent = profile && profile.name ? profile.name + "'s tracker" : "";
    } else {
      $datestr.textContent = currentView === "workout" && active
        ? fmtDate(new Date(active.date))
        : fmtDate(new Date());
    }
  }

  function render() {
    setNav();
    if (currentView === "workout") renderWorkout();
    else if (currentView === "exercises") renderExercises();
    else if (currentView === "history") renderHistory();
    else if (currentView === "progress") renderProgress();
    else renderSettings();
    document.getElementById("wt-fab")?.classList.toggle("wt-hidden", currentView !== "exercises");
  }

  document.querySelectorAll(".wt-navbtn").forEach(b => {
    b.addEventListener("click", () => { currentView = b.dataset.view; render(); });
  });

  function renderWorkout() {
    if (!active) {
      let html = `
        <div class="wt-empty">
          <div class="wt-empty-title">No workout in progress</div>
          Start one, add exercises from your library, and log sets as you go. Rest timers fire automatically.

        <button class="wt-btn wt-btn-primary wt-btn-block" id="wt-start-btn">Start Empty Workout</button>
      `;
      if (templates.length) {
        html += `<div class="wt-settings-title" style="margin:22px 0 8px;">Templates</div>`;
        templates.forEach(t => {
          html += `<div class="wt-lib-card">
            <div class="wt-lib-head">
              <div>
                <div class="wt-lib-name">${escapeHtml(t.name)}</div>
                <div class="wt-lib-meta">${t.exerciseIds.length} exercise${t.exerciseIds.length === 1 ? "" : "s"}</div>
              </div>
              <div class="wt-lib-actions">
                <button class="wt-btn wt-btn-primary wt-btn-sm" data-start-tpl="${t.id}">Start</button>
                <button class="wt-iconbtn" data-edit-tpl="${t.id}">✎</button>
                <button class="wt-iconbtn" data-del-tpl="${t.id}">✕</button>
              </div>
            </div>
          </div>`;
        });
      }
      html += `<button class="wt-btn wt-btn-ghost wt-btn-block" id="wt-new-tpl-btn" style="margin-top:8px;">+ New Template</button>`;
      $view.innerHTML = html;
      document.getElementById("wt-start-btn").addEventListener("click", startWorkout);
      document.getElementById("wt-new-tpl-btn").addEventListener("click", () => openTemplateModal(null));
      document.querySelectorAll("[data-start-tpl]").forEach(b => {
        b.addEventListener("click", () => startWorkoutFromTemplate(b.dataset.startTpl));
      });
      document.querySelectorAll("[data-edit-tpl]").forEach(b => {
        b.addEventListener("click", () => {
          const tpl = templates.find(t => t.id === b.dataset.editTpl);
          if (tpl) openTemplateModal(tpl);
        });
      });
      document.querySelectorAll("[data-del-tpl]").forEach(b => {
        b.addEventListener("click", () => {
          templates = templates.filter(t => t.id !== b.dataset.delTpl);
          saveTemplates(); render();
        });
      });
      return;
    }

    const usedIds = new Set(active.exercises.map(e => e.libId));
    const available = library.filter(e => !usedIds.has(e.id));

    let html = `<div class="wt-addex-row">
      <select id="wt-add-select">
        <option value="">${available.length ? "Add exercise…" : "All exercises added"}</option>
        ${groupLibraryForDisplay(available).map(({ group, exercises }) => `

        `).join("")}
      </select>

    if (templates.length) {
      html += `<div class="wt-addex-row">
        <select id="wt-add-tpl-select">
          <option value="">+ Add exercises from a template…</option>
          ${templates.map(t => `<option value="${t.id}">${escapeHtml(t.name)} (${t.exerciseIds.length})</option>`).join("")}
        </select>
      </div>`;
    }

    active.exercises.forEach((ex, exIdx) => {
      const allDone = ex.sets.every(s => s.done);
      html += `<div class="wt-card ${allDone ? "wt-done" : ""}">
        <div class="wt-card-head">
          <div>
            <div class="wt-ex-name">${escapeHtml(ex.name)}</div>
            <div class="wt-ex-target">${ex.sets.filter(s => !s.isWarmup).length} sets · target ${ex.mode === "cardio" ? `${ex.targetDurationMin}min/${ex.targetDistanceMi}mi` : `${ex.targetReps} reps${ex.usesWeight ? " · " + ex.targetWeight + " lb" : ""}`} · rest ${ex.restSets}s/${ex.restNext}s</div>
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;">
            <button class="wt-iconbtn" data-move-ex="${exIdx}:-1" ${exIdx === 0 ? "disabled" : ""} title="Move up">▲</button>
            <button class="wt-iconbtn" data-move-ex="${exIdx}:1" ${exIdx === active.exercises.length - 1 ? "disabled" : ""} title="Move down">▼</button>
            <button class="wt-iconbtn" data-edit-session-ex="${exIdx}" title="Edit rest times">✎</button>
            <button class="wt-iconbtn" data-guide-session="${ex.libId}" title="How to / video">📖</button>
            ${ex.mode !== "cardio" && ex.usesWeight ? `<button class="wt-iconbtn" data-plate-ex="${exIdx}" title="Plate calculator">🏋</button>` : ""}
            ${ex.mode !== "cardio" ? `<button class="wt-iconbtn ${ex.sets.some(s => s.isWarmup) ? "wt-iconbtn-active" : ""}" data-toggle-warmup="${exIdx}" title="Toggle warm-up set">W</button>` : ""}
            <button class="wt-iconbtn" data-remove-ex="${exIdx}">✕</button>
          </div>
        </div>`;

      let workingSetNum = 0;
      ex.sets.forEach((s, setIdx) => {
        const isNext = !s.done && ex.sets.slice(0, setIdx).every(p => p.done);
        if (!s.isWarmup) workingSetNum++;
        html += `<div class="wt-setrow ${s.done ? "wt-set-done" : ""} ${s.isWarmup ? "wt-set-warmup" : ""}">
          <div class="wt-setnum">${s.done ? (s.isPR ? "🏆" : "✓") : (s.isWarmup ? "W" : workingSetNum)}</div>
          ${ex.mode === "cardio" ? `
          <div class="wt-field">
            <label>Min</label>
            <input type="number" inputmode="decimal" data-ex="${exIdx}" data-set="${setIdx}" data-field="durationMin"
              value="${s.durationMin}" ${s.done ? "disabled" : ""}>
          </div>
          <div class="wt-field">
            <label>Miles</label>
            <input type="number" inputmode="decimal" step="0.01" data-ex="${exIdx}" data-set="${setIdx}" data-field="distanceMi"
              value="${s.distanceMi}" ${s.done ? "disabled" : ""}>
          </div>` : `
          <div class="wt-field">
            <label>Reps</label>
            <input type="number" inputmode="numeric" data-ex="${exIdx}" data-set="${setIdx}" data-field="reps"
              value="${s.reps}" ${s.done ? "disabled" : ""}>
          </div>
          ${ex.usesWeight ? `<div class="wt-field">
            <label>Lbs</label>
            <input type="number" inputmode="decimal" data-ex="${exIdx}" data-set="${setIdx}" data-field="weight"
              value="${s.weight}" ${s.done ? "disabled" : ""}>
          </div>` : ""}`}
          <button class="wt-logbtn" data-log="${exIdx}:${setIdx}" ${s.done || !isNext ? "disabled" : ""}>${s.done ? "✓" : "OK"}</button>
          ${!s.done ? `<button class="wt-iconbtn" data-remove-set="${exIdx}:${setIdx}" title="Remove set">✕</button>` : ""}
        </div>`;
        if (restState && restState.exIdx === exIdx && restState.afterSetIdx === setIdx) {
          html += renderInlineTimer();
        }
      });
      html += `<button class="wt-btn wt-btn-ghost wt-btn-sm" data-add-set="${exIdx}" style="margin-top:10px;">+ Add Set</button>`;
      html += `</div>`;
    });

    if (active.exercises.length) {
      html += `<div class="wt-finishbar" style="display:flex;gap:10px;">
        <button class="wt-btn wt-btn-ghost" id="wt-save-tpl-btn" style="flex:1;">Save as Template</button>
        <button class="wt-btn wt-btn-danger" id="wt-finish-btn" style="flex:1;">Finish Workout</button>
      </div>`;
    }

    $view.innerHTML = html;

    document.getElementById("wt-add-select")?.addEventListener("change", (e) => {
      if (e.target.value) addExerciseToSession(e.target.value);
    });
    document.getElementById("wt-add-tpl-select")?.addEventListener("change", (e) => {
      if (e.target.value) addTemplateToSession(e.target.value);
    });
    document.getElementById("wt-save-tpl-btn")?.addEventListener("click", () => {
      openTemplateModal({ id: null, name: "", exerciseIds: active.exercises.map(e => e.libId) });
    });
    document.querySelectorAll("[data-plate-ex]").forEach(b => {
      b.addEventListener("click", () => {
        const ex = active.exercises[parseInt(b.dataset.plateEx)];
        openPlateCalcModal(ex.targetWeight || 0);
      });
    });
    document.querySelectorAll("[data-remove-ex]").forEach(b => {
      b.addEventListener("click", () => {
        active.exercises.splice(parseInt(b.dataset.removeEx), 1);
        saveActive(); render();
      });
    });
    document.querySelectorAll("[data-move-ex]").forEach(b => {
      b.addEventListener("click", () => {
        const [exIdx, dir] = b.dataset.moveEx.split(":").map(Number);
        moveExercise(exIdx, dir);
      });
    });
    document.querySelectorAll("[data-edit-session-ex]").forEach(b => {
      b.addEventListener("click", () => openSessionExerciseEditModal(parseInt(b.dataset.editSessionEx)));
    });
    document.querySelectorAll("[data-guide-session]").forEach(b => {
      b.addEventListener("click", () => openExerciseGuideModal(b.dataset.guideSession));
    });
    document.querySelectorAll("[data-add-set]").forEach(b => {
      b.addEventListener("click", () => addSetToExercise(parseInt(b.dataset.addSet)));
    });
    document.querySelectorAll("[data-toggle-warmup]").forEach(b => {
      b.addEventListener("click", () => toggleWarmupSet(parseInt(b.dataset.toggleWarmup)));
    });
    document.querySelectorAll("[data-remove-set]").forEach(b => {
      b.addEventListener("click", () => {
        const [exIdx, setIdx] = b.dataset.removeSet.split(":").map(Number);
        removeSetFromExercise(exIdx, setIdx);
      });
    });
    document.querySelectorAll("input[data-ex]").forEach(inp => {
      inp.addEventListener("input", () => {
        const exIdx = parseInt(inp.dataset.ex), setIdx = parseInt(inp.dataset.set), field = inp.dataset.field;
        const ex = active.exercises[exIdx];
        const oldVal = ex.sets[setIdx][field];
        const newVal = parseFloat(inp.value) || 0;
        ex.sets[setIdx][field] = newVal;
        // Auto-fill forward: later not-yet-logged sets that still match the old value follow along.
        // The moment a later set has its own different value, it's considered manually set and stops following.
        for (let j = setIdx + 1; j < ex.sets.length; j++) {
          if (ex.sets[j].done) continue;
          if (ex.sets[j][field] !== oldVal) break;
          ex.sets[j][field] = newVal;
          const sib = document.querySelector(`input[data-ex="${exIdx}"][data-set="${j}"][data-field="${field}"]`);
          if (sib) sib.value = newVal;
        }
      });
    });
    document.querySelectorAll("[data-log]").forEach(b => {
      b.addEventListener("click", () => {
        const [exIdx, setIdx] = b.dataset.log.split(":").map(Number);
        logSet(exIdx, setIdx);
      });
    });
    document.getElementById("wt-finish-btn")?.addEventListener("click", finishWorkout);

    document.getElementById("wt-inline-timer-start")?.addEventListener("click", startRest);
    document.getElementById("wt-inline-timer-skip")?.addEventListener("click", finishRest);
    document.getElementById("wt-inline-timer-add15")?.addEventListener("click", () => addRestSeconds(15));
    document.getElementById("wt-inline-timer-secs")?.addEventListener("input", (e) => {
      if (!restState) return;
      const v = parseInt(e.target.value) || 0;
      restState.remaining = v;
      restState.totalSeconds = v;
    });
  }

  // ---------- ELAPSED SESSION TIMER (top of screen, runs across all tabs) ----------
  let elapsedInterval = null;
  function startElapsedTimer() {
    clearInterval(elapsedInterval);
    function tick() {
      const el = document.getElementById("wt-elapsed-timer");
      if (!active) { if (el) el.textContent = ""; clearInterval(elapsedInterval); return; }
      const secs = Math.max(0, Math.floor((Date.now() - new Date(active.date)) / 1000));
      const h = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60), s = secs % 60;
      const txt = h > 0 ? `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}` : `${m}:${String(s).padStart(2, "0")}`;
      if (el) el.textContent = "⏱ " + txt;
    }
    tick();
    elapsedInterval = setInterval(tick, 1000);
  }
  function stopElapsedTimer() {
    clearInterval(elapsedInterval);
    const el = document.getElementById("wt-elapsed-timer");
    if (el) el.textContent = "";
  }

  function startWorkout() {
    active = { id: uid(), date: new Date().toISOString(), exercises: [] };
    saveActive(); render();
    startElapsedTimer();
  }

  function getLastPerformance(libId, name) {
    // sessions is newest-first, so the first match is the most recent time this was done
    for (const s of sessions) {
      const ex = s.exercises.find(e => (e.libId === libId || e.name === name) && e.sets.some(x => x.done && !x.isWarmup));
      if (ex) return ex.sets.filter(x => x.done && !x.isWarmup);
    }
    return null;
  }

  function buildSessionExercise(lib) {
    const last = getLastPerformance(lib.id, lib.name);
    if (lib.mode === "cardio") {
      const sets = [];
      for (let i = 0; i < lib.sets; i++) {
        const prev = last && last[i] && last[i].durationMin != null ? last[i] : null;
        sets.push({ durationMin: prev ? prev.durationMin : lib.durationMin, distanceMi: prev ? prev.distanceMi : lib.distanceMi, done: false });
      }
      return {
        libId: lib.id, name: lib.name, mode: "cardio",
        targetDurationMin: lib.durationMin, targetDistanceMi: lib.distanceMi,
        restSets: lib.restSets, restNext: lib.restNext,
        sets
      };
    }
    const sets = [];
    for (let i = 0; i < lib.sets; i++) {
      const prev = last && last[i];
      sets.push({ reps: prev ? prev.reps : lib.reps, weight: prev ? prev.weight : lib.weight, done: false });
    }
    return {
      libId: lib.id, name: lib.name, usesWeight: lib.usesWeight,
      targetReps: lib.reps, targetWeight: lib.weight,
      restSets: lib.restSets, restNext: lib.restNext,
      sets
    };
  }

  function addExerciseToSession(libId) {
    const lib = library.find(e => e.id === libId);
    if (!lib) return;
    active.exercises.push(buildSessionExercise(lib));
    saveActive(); render();
  }

  function moveExercise(exIdx, dir) {
    const newIdx = exIdx + dir;
    if (newIdx < 0 || newIdx >= active.exercises.length) return;
    const [item] = active.exercises.splice(exIdx, 1);
    active.exercises.splice(newIdx, 0, item);
    saveActive(); render();
  }

  function addSetToExercise(exIdx) {
    const ex = active.exercises[exIdx];
    const last = ex.sets[ex.sets.length - 1];
    if (ex.mode === "cardio") {
      ex.sets.push({ durationMin: last ? last.durationMin : ex.targetDurationMin, distanceMi: last ? last.distanceMi : ex.targetDistanceMi, done: false });
    } else {
      ex.sets.push({ reps: last ? last.reps : ex.targetReps, weight: last ? last.weight : ex.targetWeight, done: false });
    }
    saveActive(); render();
  }

  function removeSetFromExercise(exIdx, setIdx) {
    const ex = active.exercises[exIdx];
    if (ex.sets.length <= 1) { showToast("An exercise needs at least one set — remove the exercise instead"); return; }
    ex.sets.splice(setIdx, 1);
    saveActive(); render();
  }

  function toggleWarmupSet(exIdx) {
    const ex = active.exercises[exIdx];
    const warmupIdx = ex.sets.findIndex(s => s.isWarmup);
    if (warmupIdx > -1) {
      if (ex.sets[warmupIdx].done) { showToast("Warm-up set already logged — remove it manually if you need to"); return; }
      ex.sets.splice(warmupIdx, 1);
    } else {
      const warmupWeight = ex.usesWeight ? Math.round(((ex.targetWeight || 0) * 0.5) / 5) * 5 : 0;
      ex.sets.unshift({ reps: ex.targetReps, weight: warmupWeight, done: false, isWarmup: true });
    }
    saveActive(); render();
  }

  function openSessionExerciseEditModal(exIdx) {
    const ex = active.exercises[exIdx];
    const root = document.getElementById("wt-modal-root");
    root.innerHTML = `
      <div class="wt-modal-backdrop" id="wt-sessex-backdrop">
        <div class="wt-modal">
          <h2>${escapeHtml(ex.name)}</h2>
          <div class="wt-settings-sub" style="margin-bottom:10px;">Applies to this exercise for the rest of today's session.</div>
          <div class="wt-form-row">
            <div>
              <label>Rest between sets (sec)</label>
              <input type="number" id="wt-sessex-restsets" value="${ex.restSets}">
            </div>
            <div>
              <label>Rest before next exercise (sec)</label>
              <input type="number" id="wt-sessex-restnext" value="${ex.restNext}">
            </div>
          </div>
          <div class="wt-modal-actions">
            <button class="wt-btn wt-btn-ghost" id="wt-sessex-cancel">Cancel</button>
            <button class="wt-btn wt-btn-primary" id="wt-sessex-save">Save</button>
          </div>
        </div>
      </div>`;
    document.getElementById("wt-sessex-backdrop").addEventListener("click", (e) => {
      if (e.target.id === "wt-sessex-backdrop") closeModal();
    });
    document.getElementById("wt-sessex-cancel").addEventListener("click", closeModal);
    document.getElementById("wt-sessex-save").addEventListener("click", () => {
      ex.restSets = parseInt(document.getElementById("wt-sessex-restsets").value) || 0;
      ex.restNext = parseInt(document.getElementById("wt-sessex-restnext").value) || 0;
      saveActive();
      closeModal();
      showToast("Rest times updated");
      render();
    });
  }

  function addTemplateToSession(tplId) {
    const tpl = templates.find(t => t.id === tplId);
    if (!tpl) return;
    let added = 0;
    tpl.exerciseIds.forEach(libId => {
      const lib = library.find(e => e.id === libId);
      if (lib) { active.exercises.push(buildSessionExercise(lib)); added++; }
    });
    saveActive();
    showToast(added ? `Added ${added} exercise${added === 1 ? "" : "s"} from "${tpl.name}"` : "That template has no exercises");
    render();
  }

  function startWorkoutFromTemplate(tplId) {
    const tpl = templates.find(t => t.id === tplId);
    if (!tpl) return;
    active = { id: uid(), date: new Date().toISOString(), exercises: [] };
    tpl.exerciseIds.forEach(libId => {
      const lib = library.find(e => e.id === libId);
      if (lib) active.exercises.push(buildSessionExercise(lib));
    });
    saveActive(); render();
    startElapsedTimer();
  }

  function bestValueForExercise(name, usesWeight, excludeExIdx, excludeSetIdx) {
    let best = 0;
    function scan(exList, isActive) {
      exList.forEach((e, exI) => {
        if (e.name !== name) return;
        e.sets.forEach((s, setI) => {
          if (isActive && exI === excludeExIdx && setI === excludeSetIdx) return;
          if (!s.done || s.isWarmup) return;
          const val = usesWeight ? (s.weight || 0) : (s.reps || 0);
          if (val > best) best = val;
        });
      });
    }
    sessions.forEach(s => scan(s.exercises, false));
    if (active) scan(active.exercises, true);
    return best;
  }

  function logSet(exIdx, setIdx) {
    const ex = active.exercises[exIdx];
    const set = ex.sets[setIdx];
    let isPR = false, newVal = 0;
    if (ex.mode !== "cardio" && !set.isWarmup) {
      const priorBest = bestValueForExercise(ex.name, ex.usesWeight, exIdx, setIdx);
      newVal = ex.usesWeight ? (set.weight || 0) : (set.reps || 0);
      isPR = newVal > 0 && newVal > priorBest;
    }
    set.done = true;
    if (isPR) set.isPR = true;
    saveActive();
    if (isPR) showToast(`🏆 New PR — ${ex.usesWeight ? newVal + " lb" : newVal + " reps"} on ${ex.name}`);

    const isLastSet = setIdx === ex.sets.length - 1;
    const hasIncompleteAfter = active.exercises.slice(exIdx + 1).some(e => e.sets.some(s => !s.done));
    const hasMoreSetsThisEx = ex.sets.some(s => !s.done);

    clearInterval(restInterval);
    if (hasMoreSetsThisEx && ex.restSets > 0) {
      restState = {
        exIdx, afterSetIdx: setIdx, kind: "between",
        totalSeconds: ex.restSets, remaining: ex.restSets, running: false,
        nextLabel: `Next: ${ex.name}, set ${ex.sets.findIndex(s => !s.done) + 1}`
      };
    } else if (isLastSet && hasIncompleteAfter && ex.restNext > 0) {
      const nextEx = active.exercises.slice(exIdx + 1).find(e => e.sets.some(s => !s.done));
      restState = {
        exIdx, afterSetIdx: setIdx, kind: "next-exercise",
        totalSeconds: ex.restNext, remaining: ex.restNext, running: false,
        nextLabel: nextEx ? `Next: ${nextEx.name}` : ""
      };
    } else {
      restState = null;
    }
    render();
  }

  async function finishWorkout() {
    const hasLogged = active.exercises.some(e => e.sets.some(s => s.done));
    if (hasLogged) {
      active.finishedAt = new Date().toISOString();
      sessions.unshift(active);
      await saveSessions();
    }
    active = null;
    await saveActive();
    stopElapsedTimer();
    render();
  }

  function sessionStats(s) {
    let totalWeight = 0, totalSets = 0, cardioMin = 0, cardioMi = 0;
    s.exercises.forEach(e => {
      e.sets.forEach(set => {
        if (!set.done || set.isWarmup) return;
        if (e.mode === "cardio") {
          cardioMin += set.durationMin || 0;
          cardioMi += set.distanceMi || 0;
        } else {
          totalSets++;
          if (e.usesWeight) totalWeight += (set.reps || 0) * (set.weight || 0);
          else if (profile && profile.bodyweight) totalWeight += (set.reps || 0) * profile.bodyweight;
        }
      });
    });
    let durationMin = null;
    if (s.finishedAt) {
      durationMin = Math.max(1, Math.round((new Date(s.finishedAt) - new Date(s.date)) / 60000));
    }
    return { totalWeight, totalSets, durationMin, cardioMin, cardioMi };
  }

  // ---------- REST TIMER (inline) ----------
  let restState = null; // { exIdx, afterSetIdx, kind, totalSeconds, remaining, running, endTime, nextLabel }
  let restInterval = null;

  function renderInlineTimer() {
    if (!restState) return "";
    const label = restState.kind === "between" ? "REST BETWEEN SETS" : "REST BEFORE NEXT EXERCISE";
    if (!restState.running) {
      return `<div class="wt-inline-timer">
        <div class="wt-inline-timer-label">${label}</div>
        <div class="wt-inline-timer-row">
          <input type="number" id="wt-inline-timer-secs" class="wt-inline-timer-secs" value="${restState.remaining}">
          <span style="color:var(--text-muted);font-size:12px;">sec</span>
          <button class="wt-btn wt-btn-primary wt-btn-sm" id="wt-inline-timer-start">Start</button>
          <button class="wt-btn wt-btn-ghost wt-btn-sm" id="wt-inline-timer-skip">Skip</button>
        </div>
        ${restState.nextLabel ? `<div class="wt-inline-timer-next">${escapeHtml(restState.nextLabel)}</div>` : ""}
      </div>`;
    }
    return `<div class="wt-inline-timer">
      <div class="wt-inline-timer-label">${label}</div>
      <div class="wt-inline-timer-count" id="wt-inline-timer-num">${fmtTime(restState.remaining)}</div>
      ${restState.nextLabel ? `<div class="wt-inline-timer-next">${escapeHtml(restState.nextLabel)}</div>` : ""}
      <div class="wt-inline-timer-actions">
        <button class="wt-btn wt-btn-ghost wt-btn-sm" id="wt-inline-timer-add15">+15s</button>
        <button class="wt-btn wt-btn-primary wt-btn-sm" id="wt-inline-timer-skip">Skip</button>
      </div>
    </div>`;
  }

  function startRest() {
    if (!restState) return;
    restState.running = true;
    restState.endTime = Date.now() + restState.remaining * 1000;
    render();
    clearInterval(restInterval);
    restInterval = setInterval(() => {
      if (!restState || !restState.running) { clearInterval(restInterval); return; }
      const remaining = Math.max(0, Math.round((restState.endTime - Date.now()) / 1000));
      restState.remaining = remaining;
      const numEl = document.getElementById("wt-inline-timer-num");
      if (numEl) numEl.textContent = fmtTime(remaining);
      if (remaining <= 0) {
        clearInterval(restInterval);
        beep();
        if (navigator.vibrate) navigator.vibrate([200, 80, 200]);
        finishRest();
      }
    }, 250);
  }

  function addRestSeconds(sec) {
    if (!restState) return;
    restState.remaining += sec;
    if (restState.running) restState.endTime += sec * 1000;
    render();
  }

  function finishRest() {
    clearInterval(restInterval);
    restState = null;
    render();
  }

  function beep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = "sine";
      o.frequency.value = 880;
      g.gain.setValueAtTime(0.001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
      o.connect(g); g.connect(ctx.destination);
      o.start();
      o.stop(ctx.currentTime + 0.45);
    } catch (e) {}
  }

  // ---------- EXERCISES VIEW ----------
  function renderExercises() {
    let html = `<button class="wt-ai-btn" id="wt-ai-open-btn">✨ Generate Routine with AI</button>`;
    if (!library.length) {
      html += `<div class="wt-empty"><div class="wt-empty-title">No exercises yet</div>Tap + to add one manually, or generate a routine with AI above.</div>`;
    } else {
      groupLibraryForDisplay(library).forEach(({ group, exercises }) => {
        html += `<div class="wt-settings-title" style="margin:18px 0 8px;">${escapeHtml(group)}</div>`;
        exercises.forEach(ex => {
          html += `<div class="wt-lib-card">
            <div class="wt-lib-head">
              <div>
                <div class="wt-lib-name">${escapeHtml(ex.name)}${ex.day ? `<span class="wt-daybadge">${escapeHtml(ex.day)}</span>` : ""}</div>
                <div class="wt-lib-meta">${ex.mode === "cardio" ? `${ex.sets} × ${ex.durationMin}min/${ex.distanceMi}mi` : `${ex.sets} × ${ex.reps}${ex.usesWeight ? " @ " + ex.weight + " lb" : ""}`} · rest ${ex.restSets}s/${ex.restNext}s</div>
              </div>
              <div class="wt-lib-actions">
                <button class="wt-iconbtn" data-guide="${ex.id}" title="How to / video">📖</button>
                <button class="wt-iconbtn" data-edit="${ex.id}">✎</button>
                <button class="wt-iconbtn" data-del="${ex.id}">✕</button>
              </div>
            </div>
          </div>`;
        });

  async function runAiTrainer() {
    const equipment = document.getElementById("wt-ai-equipment").value.trim();
    const goal = document.getElementById("wt-ai-goal").value;
    const days = document.getElementById("wt-ai-days").value;
    const resultBox = document.getElementById("wt-ai-result");
    const genBtn = document.getElementById("wt-ai-generate");
    if (!equipment) return;

    genBtn.disabled = true;
    resultBox.innerHTML = `<div class="wt-spinner"></div><div style="text-align:center;color:var(--text-muted);font-size:13px;">Designing your routine…</div>`;

    const prompt = `You are a strength coach. Equipment available: ${equipment}. Goal: ${goal}. Training ${days} days per week using a sensible split for that frequency (e.g. push/pull/legs, upper/lower, or full body depending on frequency). Respond with ONLY minified JSON, no markdown fences, no commentary, in exactly this shape: {"exercises":[{"name":"Exercise Name","day":"Push","usesWeight":true,"sets":4,"reps":10,"restSets":75,"restNext":60}]}. "day" must be one of Push, Pull, Legs, Cardio, Any. Include 12-16 exercises total covering the full split, using only the equipment listed. Keep it compact.`;

    try {
      const headers = { "Content-Type": "application/json" };
      // Inside the Claude artifact runtime, no key is needed — the platform injects auth invisibly.
      // Running standalone (e.g. GitHub Pages), a key saved in Settings is required for this to work.
      if (profile && profile.anthropicKey) {
        headers["x-api-key"] = profile.anthropicKey;
        headers["anthropic-dangerous-direct-browser-access"] = "true";
      }
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers,
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          messages: [{ role: "user", content: prompt }]
        })
      });
      if (!response.ok) throw new Error("Request failed (" + response.status + ")");
      const data = await response.json();
      const text = (data.content || [])
        .filter(b => b.type === "text")
        .map(b => b.text)
        .join("\n")
        .replace(/```json|```/g, "")
        .trim();
      const parsed = JSON.parse(text);
      const exercises = Array.isArray(parsed.exercises) ? parsed.exercises : [];
      if (!exercises.length) throw new Error("No exercises came back — try again");
      renderAiPreview(exercises);
    } catch (e) {
      resultBox.innerHTML = `<div class="wt-error-box">Couldn't generate a routine: ${escapeHtml(e.message || "unknown error")}. Try again, or adjust your equipment list.</div>`;
    } finally {
      genBtn.disabled = false;
    }
  }

  // ---------- PLATE CALCULATOR ----------
  function calcPlates(target, bar) {
    let perSide = Math.max(0, (target - bar) / 2);
    const plateSizes = [45, 35, 25, 10, 5, 2.5];
    const used = [];
    plateSizes.forEach(p => {
      while (perSide >= p - 0.001) { used.push(p); perSide -= p; }
    });
    return { used, remainder: perSide };
  }

  function openPlateCalcModal(prefillTarget) {
    const root = document.getElementById("wt-modal-root");
    root.innerHTML = `
      <div class="wt-modal-backdrop" id="wt-plate-backdrop">
        <div class="wt-modal">
          <h2>🏋 Plate Calculator</h2>
          <div class="wt-form-row">
            <div>
              <label>Bar weight (lb)</label>
              <input type="number" id="wt-plate-bar" value="${lastBarWeight}">
            </div>
            <div>
              <label>Target weight (lb)</label>
              <input type="number" id="wt-plate-target" value="${prefillTarget || 0}">
            </div>
          </div>
          <div id="wt-plate-result" style="margin-top:16px;"></div>
          <div class="wt-modal-actions">
            <button class="wt-btn wt-btn-ghost wt-btn-block" id="wt-plate-close">Close</button>
          </div>
        </div>
      </div>`;
    const barInp = document.getElementById("wt-plate-bar");
    const targetInp = document.getElementById("wt-plate-target");
    function update() {
      const bar = parseFloat(barInp.value) || 0;
      const target = parseFloat(targetInp.value) || 0;
      lastBarWeight = bar;
      const resultEl = document.getElementById("wt-plate-result");
      if (target <= bar) {
        resultEl.innerHTML = `<div class="wt-settings-sub">Target is at or below the bar — no plates needed.</div>`;
        return;
      }
      const { used, remainder } = calcPlates(target, bar);
      if (!used.length) {
        resultEl.innerHTML = `<div class="wt-settings-sub">No plates needed for this weight.</div>`;
        return;
      }
      const total = bar + used.reduce((a, b) => a + b, 0) * 2;
      resultEl.innerHTML = `
        <div class="wt-settings-title">Per side</div>
        <div style="font-size:20px;font-weight:800;margin:6px 0;">${used.join(" · ")} lb</div>
        <div class="wt-settings-sub">${used.length} plate${used.length === 1 ? "" : "s"} per side + ${bar} lb bar = ${total.toFixed(1)} lb total${remainder > 0.01 ? `<br>⚠ ${remainder.toFixed(1)} lb per side can't be made with standard plates (45/35/25/10/5/2.5)` : ""}</div>
      `;
    }
    barInp.addEventListener("input", update);
    targetInp.addEventListener("input", update);
    update();
    document.getElementById("wt-plate-backdrop").addEventListener("click", (e) => {
      if (e.target.id === "wt-plate-backdrop") closeModal();
    });
    document.getElementById("wt-plate-close").addEventListener("click", closeModal);
  }

  // ---------- HISTORY VIEW ----------
  let expandedHistoryIds = new Set();
  let historyViewMode = "list"; // "list" | "calendar"
  let calendarMonth = new Date(); // which month the calendar is showing
  let historyDateFilter = null; // "YYYY-MM-DD" set by tapping a calendar day, or null for all

  function localDateKey(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function fmtCompactNum(n) {
    return n >= 1000 ? (n / 1000).toFixed(1) + "k" : n.toLocaleString();
  }
  function historyToggleBarHtml() {
    return `<div style="display:flex;gap:6px;margin-bottom:14px;">
      <button class="wt-btn ${historyViewMode === "list" ? "wt-btn-primary" : "wt-btn-ghost"} wt-btn-sm" id="wt-hist-mode-list" style="flex:1;">List</button>
      <button class="wt-btn ${historyViewMode === "calendar" ? "wt-btn-primary" : "wt-btn-ghost"} wt-btn-sm" id="wt-hist-mode-cal" style="flex:1;">Calendar</button>
    </div>`;
  }
  function wireHistoryToggle() {
    document.getElementById("wt-hist-mode-list").addEventListener("click", () => { historyViewMode = "list"; render(); });
    document.getElementById("wt-hist-mode-cal").addEventListener("click", () => { historyViewMode = "calendar"; render(); });
  }

  function renderHistory() {
    if (historyViewMode === "calendar") { renderHistoryCalendar(); return; }

    const toggleBar = historyToggleBarHtml();
    if (!sessions.length) {
      $view.innerHTML = toggleBar + `<div class="wt-empty"><div class="wt-empty-title">No workouts logged yet</div>Finish a session and it'll show up here.</div>`;
      wireHistoryToggle();
      return;
    }
    let html = toggleBar;
    if (historyDateFilter) {
      html += `<div class="wt-settings-sub" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <span>Showing ${historyDateFilter}</span>
        <button class="wt-btn wt-btn-ghost wt-btn-sm" id="wt-hist-clear-filter">Show All</button>
      </div>`;
    }
    const filtered = historyDateFilter ? sessions.filter(s => localDateKey(new Date(s.date)) === historyDateFilter) : sessions;
    if (!filtered.length) html += `<div class="wt-empty">No sessions logged on this date.</div>`;
    filtered.forEach(s => {
      const d = new Date(s.date);
      const stats = sessionStats(s);
      const parts = [];
      if (stats.totalWeight > 0) parts.push(`${stats.totalWeight.toLocaleString()} lb moved`);
      if (stats.cardioMi > 0) parts.push(`${stats.cardioMi.toFixed(1)} mi cardio`);
      else if (stats.cardioMin > 0) parts.push(`${stats.cardioMin} cardio min`);
      if (stats.durationMin) parts.push(`${stats.durationMin} min`);
      if (!parts.length) parts.push(`${s.exercises.length} exercise${s.exercises.length === 1 ? "" : "s"}`);
      const isOpen = expandedHistoryIds.has(s.id);
      html += `<div class="wt-hist-card" data-hist-toggle="${s.id}" style="cursor:pointer;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
          <div>
            <div class="wt-hist-date">${isOpen ? "▾" : "▸"} ${fmtDate(d)}</div>
            <div class="wt-hist-sub">${parts.join(" · ")}</div>
          </div>
          <button class="wt-iconbtn" data-hist-delete="${s.id}" title="Delete session">✕</button>
        </div>`;
      if (isOpen) {
        s.exercises.forEach(e => {
          const loggedSets = e.sets.filter(x => x.done);
          if (!loggedSets.length) return;
          html += `<div class="wt-hist-ex">
            <div class="wt-hist-ex-name">${escapeHtml(e.name)}</div>
            <div class="wt-hist-set">${e.mode === "cardio"
              ? loggedSets.map(x => `${x.durationMin}min / ${x.distanceMi}mi`).join(" · ")
              : loggedSets.map(x => (x.isWarmup ? "W: " : "") + (e.usesWeight ? `${x.reps}×${x.weight}lb` : `${x.reps} reps`) + (x.isPR ? " 🏆" : "")).join(" · ")}</div>
          </div>`;
        });
      }
      html += `</div>`;
    });
    $view.innerHTML = html;
    wireHistoryToggle();
    document.getElementById("wt-hist-clear-filter")?.addEventListener("click", () => { historyDateFilter = null; render(); });
    document.querySelectorAll("[data-hist-delete]").forEach(btn => {
      btn.addEventListener("click", async (e) => {
        e.stopPropagation();
        if (!confirm("Delete this workout session? This can't be undone.")) return;
        const id = btn.dataset.histDelete;
        sessions = sessions.filter(s => s.id !== id);
        await saveSessions();
        showToast("Session deleted");
        render();
      });
    });
    document.querySelectorAll("[data-hist-toggle]").forEach(card => {
      card.addEventListener("click", () => {
        const id = card.dataset.histToggle;
        if (expandedHistoryIds.has(id)) expandedHistoryIds.delete(id);
        else expandedHistoryIds.add(id);
        render();
      });
    });
  }

  function renderHistoryCalendar() {
    const year = calendarMonth.getFullYear();
    const month = calendarMonth.getMonth();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const startOffset = new Date(year, month, 1).getDay();

    const byDate = {};
    sessions.forEach(s => {
      const key = localDateKey(new Date(s.date));
      const stats = sessionStats(s);
      if (!byDate[key]) byDate[key] = { weight: 0, duration: 0, cardioMi: 0 };
      byDate[key].weight += stats.totalWeight;
      byDate[key].duration += stats.durationMin || 0;
      byDate[key].cardioMi += stats.cardioMi;
    });

    const monthLabel = calendarMonth.toLocaleDateString(undefined, { month: "long", year: "numeric" });
    const dow = ["S", "M", "T", "W", "T", "F", "S"];

    let html = historyToggleBarHtml();
    html += `<div class="wt-cal-nav">
      <button class="wt-iconbtn" id="wt-cal-prev">‹</button>
      <div class="wt-cal-nav-title">${monthLabel}</div>
      <button class="wt-iconbtn" id="wt-cal-next">›</button>
    </div>
    <div class="wt-cal-grid">
      ${dow.map(d => `<div class="wt-cal-dow">${d}</div>`).join("")}
      ${Array.from({ length: startOffset }).map(() => `<div class="wt-cal-cell wt-cal-empty"></div>`).join("")}
      ${Array.from({ length: daysInMonth }).map((_, i) => {
        const dayNum = i + 1;
        const key = year + "-" + String(month + 1).padStart(2, "0") + "-" + String(dayNum).padStart(2, "0");
        const data = byDate[key];
        return `<div class="wt-cal-cell ${data ? "wt-cal-has-data" : ""}" ${data ? `data-cal-date="${key}"` : ""}>
          <div class="wt-cal-daynum">${dayNum}</div>

      }).join("")}

    $view.innerHTML = html;
    wireHistoryToggle();
    document.getElementById("wt-cal-prev").addEventListener("click", () => { calendarMonth = new Date(year, month - 1, 1); render(); });
    document.getElementById("wt-cal-next").addEventListener("click", () => { calendarMonth = new Date(year, month + 1, 1); render(); });
    document.querySelectorAll("[data-cal-date]").forEach(cell => {
      cell.addEventListener("click", () => {
        historyDateFilter = cell.dataset.calDate;
        historyViewMode = "list";
        render();

    });
  }

  // ---------- PROGRESS VIEW ----------
  function svgBarChart(values, labels, opts) {
    opts = opts || {};
    const w = 420, h = 140, padL = 34, padB = 20, padT = 10;
    const max = Math.max(1, ...values);
    const barW = (w - padL - 10) / values.length;
    let bars = "";
    values.forEach((v, i) => {
      const barH = (v / max) * (h - padT - padB);
      const x = padL + i * barW + barW * 0.15;
      const y = h - padB - barH;
      bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(barW * 0.7).toFixed(1)}" height="${barH.toFixed(1)}" rx="3" fill="${opts.color || '#F2A93B'}"/>`;
    });
    const gridLines = [0, 0.5, 1].map(f => {
      const y = padT + (h - padT - padB) * (1 - f);
      const val = Math.round(max * f);
      return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w - 6}" y2="${y.toFixed(1)}" stroke="#2A3140" stroke-width="1"/>
              <text x="2" y="${(y + 3).toFixed(1)}" font-size="9" fill="#8A93A6">${val}</text>`;
    }).join("");
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">${gridLines}${bars}</svg>`;
  }

  function renderProgress() {
    if (!sessions.length) {
      $view.innerHTML = `<div class="wt-empty"><div class="wt-empty-title">Nothing to show yet</div>Finish a few workouts and your trends will show up here.</div>`;
      return;
    }
    const recent = sessions.slice(0, 10).slice().reverse(); // oldest to newest, last 10
    const weights = recent.map(s => sessionStats(s).totalWeight);
    const durations = recent.map(s => sessionStats(s).durationMin || 0);
    const dateLabels = recent.map(s => new Date(s.date).toLocaleDateString(undefined, { month: "short", day: "numeric" }));

    const totalAllTime = sessions.reduce((sum, s) => sum + sessionStats(s).totalWeight, 0);
    const totalCardioMi = sessions.reduce((sum, s) => sum + sessionStats(s).cardioMi, 0);
    const totalSessions = sessions.length;
    const avgDuration = Math.round(
      sessions.map(s => sessionStats(s).durationMin).filter(Boolean).reduce((a, b) => a + b, 0) /
      Math.max(1, sessions.map(s => sessionStats(s).durationMin).filter(Boolean).length)
    );

    let html = `
      <div class="wt-settings-card">
        <div class="wt-settings-title">All-Time</div>
        <div class="wt-settings-sub">
          ${totalAllTime.toLocaleString()} lb total moved · ${totalSessions} workouts logged · avg ${avgDuration || "—"} min/session${totalCardioMi > 0 ? ` · ${totalCardioMi.toFixed(1)} mi cardio` : ""}
        </div>
      </div>
      <div class="wt-settings-card">
        <div class="wt-settings-title">Weight Moved (Last ${recent.length} Sessions)</div>
        ${svgBarChart(weights, dateLabels, { color: "#F2A93B" })}
      </div>
      <div class="wt-settings-card">
        <div class="wt-settings-title">Workout Duration, Minutes (Last ${recent.length} Sessions)</div>
        ${svgBarChart(durations, dateLabels, { color: "#4ADE80" })}
      </div>
    `;

    // per-exercise progression: pick top logged exercises
    const exerciseTotals = {};
    sessions.forEach(s => s.exercises.forEach(e => {
      const loggedSets = e.sets.filter(x => x.done);
      if (!loggedSets.length) return;
      exerciseTotals[e.name] = (exerciseTotals[e.name] || 0) + loggedSets.length;
    }));
    const topExercises = Object.entries(exerciseTotals).sort((a, b) => b[1] - a[1]).slice(0, 3).map(x => x[0]);

    topExercises.forEach(name => {
      const points = [];
      sessions.slice().reverse().forEach(s => {
        s.exercises.forEach(e => {
          if (e.name !== name) return;
          const loggedSets = e.sets.filter(x => x.done);
          if (!loggedSets.length) return;
          const topWeight = e.usesWeight ? Math.max(...loggedSets.map(x => x.weight || 0)) : null;
          points.push(topWeight);
        });
      });
      const trimmed = points.slice(-10);
      if (trimmed.some(v => v > 0)) {
        html += `<div class="wt-settings-card">
          <div class="wt-settings-title">${escapeHtml(name)} — Top Set Weight</div>
          ${svgBarChart(trimmed, [], { color: "#7DA6F2" })}
        </div>`;
      }
    });

    const prs = allPRs();
    if (prs.length) {
      html += `<div class="wt-settings-card">
        <div class="wt-settings-title">🏆 Personal Records</div>
        ${prs.map(p => `<div class="wt-hist-sub" style="padding:4px 0;">${escapeHtml(p.name)} — <strong style="color:var(--text);">${p.usesWeight ? p.val + " lb" : p.val + " reps"}</strong></div>`).join("")}
      </div>`;
    }

    $view.innerHTML = html;
  }

  function allPRs() {
    const map = {};
    function scan(exList) {
      exList.forEach(e => {
        if (e.mode === "cardio") return;
        e.sets.forEach(s => {
          if (!s.done || s.isWarmup) return;
          const val = e.usesWeight ? (s.weight || 0) : (s.reps || 0);
          if (val <= 0) return;
          if (!map[e.name] || val > map[e.name].val) map[e.name] = { val, usesWeight: e.usesWeight };
        });
      });
    }
    sessions.forEach(s => scan(s.exercises));
    if (active) scan(active.exercises);
    return Object.entries(map).map(([name, v]) => ({ name, val: v.val, usesWeight: v.usesWeight })).sort((a, b) => a.name.localeCompare(b.name));
  }

        else parts = line.split(/,(.+)/);
        if (parts.length < 2) return;
        const name = (parts[0] || "").trim();
        const url = (parts[1] || "").trim();
        if (!name || !url) return;
        const match = library.find(e => e.name.trim().toLowerCase() === name.toLowerCase());
        if (match) { match.videoUrl = url; matched++; }
        else unmatched.push(name);
      });
      await saveLibrary();
      const unmatchedMsg = unmatched.length ? ` — no match: ${unmatched.slice(0, 3).join(", ")}${unmatched.length > 3 ? "…" : ""}` : "";
      showToast(matched ? `Applied ${matched} link${matched === 1 ? "" : "s"}${unmatchedMsg}` : `No links applied${unmatchedMsg || " — check the format"}`);
      render();
    });

    document.getElementById("wt-normalize-btn").addEventListener("click", async () => {
      if (!library.length) { showToast("No exercises in your library yet"); return; }
      library.forEach(ex => { ex.sets = 3; ex.reps = 10; });
      await saveLibrary();
      showToast("All exercises set to 3×10");
      render();
    });

    document.getElementById("wt-set-name-save").addEventListener("click", async () => {
      const name = document.getElementById("wt-set-name").value.trim();
      profile = { ...(profile || {}), name };
      await saveProfile();
      showToast("Name saved");
      render();
    });

    document.getElementById("wt-set-apikey-save").addEventListener("click", async () => {
      const key = document.getElementById("wt-set-apikey").value.trim();
      profile = { ...(profile || {}), anthropicKey: key };
      await saveProfile();
      showToast(key ? "API key saved" : "API key cleared");
      render();
    });

    document.getElementById("wt-set-bodyweight-save").addEventListener("click", async () => {
      const bw = parseFloat(document.getElementById("wt-set-bodyweight").value) || 0;
      profile = { ...(profile || {}), bodyweight: bw };
      await saveProfile();
      showToast("Body weight saved");
      render();
    });

    document.getElementById("wt-copy-btn").addEventListener("click", async () => {
      const box = document.getElementById("wt-export-box");
      try {
        await navigator.clipboard.writeText(box.value);
        showToast("Copied");
      } catch (e) {
        box.select();
        showToast("Select the text above and copy manually");
      }
    });

    document.getElementById("wt-import-btn").addEventListener("click", async () => {
      const raw = document.getElementById("wt-import-box").value.trim();
      if (!raw) return;
      try {
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed.library) || !Array.isArray(parsed.sessions)) {
          throw new Error("Missing library or sessions array");
        }
        library = parsed.library;
        sessions = parsed.sessions;
        templates = Array.isArray(parsed.templates) ? parsed.templates : templates;
        await saveLibrary();
        await saveSessions();
        await saveTemplates();
        showToast("Data restored");
        render();
      } catch (e) {
        showToast("That didn't look like a valid backup");
      }
    });

    document.getElementById("wt-reset-btn").addEventListener("click", async () => {
      if (!confirm("This deletes all exercises, history, templates, and any in-progress workout. This can't be undone. Continue?")) return;
      library = [];
      sessions = [];
      templates = [];
      active = null;
      await saveLibrary();
      await saveSessions();
      await saveTemplates();
      await saveActive();
      showToast("Everything reset");
      currentView = "exercises";
      render();
    });
  }

  // ---------- ONBOARDING ----------
  function maybeShowOnboarding() {
    if (profile) return;
    const root = document.getElementById("wt-modal-root");
    root.innerHTML = `
      <div class="wt-modal-backdrop" id="wt-onboard-backdrop">
        <div class="wt-modal">
          <h2>Welcome</h2>
          <div class="wt-settings-sub" style="margin-bottom:14px;">
            This tracker is yours alone — your data stays separate from anyone else who opens it.
            What should we call you?
          </div>
          <div class="wt-form">
            <input type="text" id="wt-onboard-name" placeholder="Your name">
          </div>
          <div class="wt-modal-actions">
            <button class="wt-btn wt-btn-primary wt-btn-block" id="wt-onboard-save">Get Started</button>
          </div>
        </div>
      </div>`;
    document.getElementById("wt-onboard-save").addEventListener("click", async () => {
      const name = document.getElementById("wt-onboard-name").value.trim();
      profile = { name: name || "" };
      await saveProfile();
      document.getElementById("wt-modal-root").innerHTML = "";
      render();
    });
  }

  function escapeHtml(str) {
    const d = document.createElement("div");
    d.textContent = str;
    return d.innerHTML;
  }

  // ---------- CLOUD SYNC AUTH GATE (standalone hosting only) ----------
  function renderAuthGate(errorMsg) {
    document.getElementById("wt-root").innerHTML = `
      <div class="wt-topbar"><h1>Sign In</h1><div class="wt-sub">Cloud Sync</div></div>
      <div class="wt-main">
        <div class="wt-settings-sub" style="margin-bottom:14px;">Sign in to sync your data across devices. First time here? Sign up below with any email/password.</div>
        ${errorMsg ? `<div class="wt-error-box" style="margin-bottom:12px;">${escapeHtml(errorMsg)}</div>` : ""}
        <div class="wt-form">
          <div><label>Email</label><input type="email" id="wt-auth-email"></div>
          <div><label>Password</label><input type="password" id="wt-auth-password"></div>
        </div>
        <div class="wt-modal-actions">
          <button class="wt-btn wt-btn-ghost" id="wt-auth-signup" style="flex:1;">Sign Up</button>
          <button class="wt-btn wt-btn-primary" id="wt-auth-signin" style="flex:1;">Sign In</button>
        </div>
        <button class="wt-btn wt-btn-ghost wt-btn-block" id="wt-auth-cancel" style="margin-top:20px;">Use offline mode on this device instead</button>
      </div>`;
    const emailInp = document.getElementById("wt-auth-email");
    const passInp = document.getElementById("wt-auth-password");
    document.getElementById("wt-auth-signin").addEventListener("click", async () => {
      const { error } = await sbClient.auth.signInWithPassword({ email: emailInp.value.trim(), password: passInp.value });
      if (error) { renderAuthGate(error.message); return; }
      location.reload();
    });
    document.getElementById("wt-auth-signup").addEventListener("click", async () => {
      const { error } = await sbClient.auth.signUp({ email: emailInp.value.trim(), password: passInp.value });
      if (error) { renderAuthGate(error.message); return; }
      showToast("Account created — check email to confirm if required, then sign in");
      renderAuthGate();
    });
    document.getElementById("wt-auth-cancel").addEventListener("click", () => {
      clearSbConfig();
      location.reload();
    });
  }

  // ---------- init ----------
  (async function init() {
    await initStorage();
    if (sbClient && !sbUser) { renderAuthGate(); return; }
    $view.innerHTML = `<div class="wt-empty">Loading…</div>`;
    await loadAll();
    render();
    maybeShowOnboarding();
    if (active) startElapsedTimer();
  })();
})();
</script>
